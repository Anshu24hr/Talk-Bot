<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meena (AI)</title>
  <h1>Meena 👸</h1>
  
  
    <h4>Cᴏᴅᴇᴅ with <span class="text-danger text-blink"> ♥️</span> Bʏ 🄰🄽🅂🄷🅄 </h4>
   
  
  <link rel="stylesheet" href="stylesh.css">
</head>
<body>
  <button id="start">Start</button>
  <button id="stop">Stop</button>
  
  
  <script>

const stBtn = document.getElementById('start')
const stopBtn = document.getElementById('stop')


function readOutHindi(message) {
  const speech = new SpeechSynthesisUtterance();

  speech.text = message;
  speech.volume = 1;
  speech.lang = "hi-IN"
  window.speechSynthesis.speak(speech);
  console.log("Speaking out");
  // createMsg("jmsg", message);
}
function readOut(message) {

  const speech = new SpeechSynthesisUtterance();

  speech.text = message;
  speech.volume = 1;
  window.speechSynthesis.speak(speech);
  console.log("Speaking out");
}

stBtn.addEventListener("click",() => {
    readOut("hello sir just checking language")
});
stopBtn.addEventListener("click",() => {
    readOutHindi("hello sir just checking language")
});


</script>

  </style>
</body>
</html>
